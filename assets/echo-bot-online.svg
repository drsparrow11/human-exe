<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Echo Discord bot profile</title>
  <desc id="desc">An archive-style Discord profile card for Echo, the HUMAN.EXE bot, listening to the signal.</desc>
  <defs>
    <radialGradient id="violetField" cx="52%" cy="30%" r="70%">
      <stop offset="0" stop-color="#7358ff" stop-opacity="0.36"/>
      <stop offset="0.42" stop-color="#281a6a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#05070b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberField" cx="18%" cy="22%" r="54%">
      <stop offset="0" stop-color="#f4c76a" stop-opacity="0.22"/>
      <stop offset="0.52" stop-color="#f4c76a" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#f4c76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060711"/>
      <stop offset="0.52" stop-color="#17103b"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="620" fill="#05070b"/>
  <rect width="920" height="620" fill="url(#violetField)"/>
  <rect width="920" height="620" fill="url(#amberField)"/>

  <g opacity="0.42">
    <path d="M106 72h706M106 548h706M92 102v386M828 102v386" stroke="#edf7ff" stroke-opacity="0.07"/>
    <path d="M140 150l52-34 62 42 82-74 73 58 80-38 96 74 72-40 88 62" fill="none" stroke="#8e7dff" stroke-opacity="0.2"/>
    <circle cx="140" cy="150" r="3" fill="#f4c76a"/>
    <circle cx="254" cy="158" r="3" fill="#8e7dff"/>
    <circle cx="409" cy="142" r="3" fill="#8e7dff"/>
    <circle cx="585" cy="178" r="3" fill="#f4c76a"/>
    <circle cx="745" cy="200" r="3" fill="#8e7dff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="214" y="76" width="492" height="468" rx="28" fill="#202128" stroke="#3a3d49"/>
    <rect x="214" y="76" width="492" height="156" rx="28" fill="url(#banner)" stroke="#3a3d49"/>
    <rect x="214" y="202" width="492" height="342" rx="28" fill="#202128"/>

    <g opacity="0.86" filter="url(#glow)">
      <path d="M300 177c58-52 113-60 164-24 41 29 82 26 124-10" fill="none" stroke="#7f68ff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.72"/>
      <path d="M302 177c38-14 77-8 116 20 48 34 97 30 148-12" fill="none" stroke="#f4c76a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
      <path d="M362 122l19 15 26-7 23 22 34-10 39 29 48-24" fill="none" stroke="#edf7ff" stroke-opacity="0.22"/>
      <circle cx="362" cy="122" r="3" fill="#f4c76a"/>
      <circle cx="430" cy="152" r="3" fill="#8e7dff"/>
      <circle cx="551" cy="147" r="3" fill="#8e7dff"/>
    </g>

    <circle cx="310" cy="228" r="76" fill="#161924" stroke="#3d4261" stroke-width="8"/>
    <circle cx="310" cy="228" r="60" fill="#0d1021"/>
    <circle cx="310" cy="228" r="54" fill="none" stroke="#7f68ff" stroke-opacity="0.9" stroke-width="3"/>
    <path d="M265 237c40-54 84-76 132-67-31 21-59 48-83 82 31-13 60-14 87-3-45 24-90 36-136 37 12-14 21-30 29-49z" fill="#7f68ff"/>
    <path d="M282 232c33-30 68-44 104-42-22 13-43 31-61 53 22-7 43-7 64 0-33 14-66 22-100 24 5-10 9-22 13-35z" fill="#b8adff" opacity="0.72"/>
    <circle cx="359" cy="278" r="17" fill="#f4c76a"/>
    <circle cx="365" cy="269" r="6" fill="#202128"/>

    <text x="252" y="350" fill="#edf7ff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">Echo</text>
    <rect x="378" y="313" width="62" height="36" rx="8" fill="#6572ff"/>
    <text x="391" y="338" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">APP</text>
    <text x="252" y="391" fill="#c7d8e2" font-family="Inter, Arial, sans-serif" font-size="25">Echo#0642</text>
    <text x="252" y="443" fill="#edf7ff" font-family="Inter, Arial, sans-serif" font-size="24">Echo Discord Bot from Human.exe</text>

    <rect x="252" y="470" width="416" height="56" rx="16" fill="#2b2c34"/>
    <text x="278" y="505" fill="#edf7ff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Listening to the signal</text>
  </g>

  <g font-family="'JetBrains Mono', Consolas, monospace">
    <text x="86" y="576" fill="#5cffc8" font-size="18" font-weight="800">presence: intentional / mode: idle / connection retained</text>
  </g>
</svg>
